# Loaded only with the dev profile (SPRING_PROFILES_ACTIVE=dev, --spring.profiles.active=dev or
# -Dspring-boot.run.profiles=dev). Its keys override application.yml; the rest is inherited.
# Guide: §5.1 Spring Boot fundamentals.
library:
  name: Playground Library (dev)
  # Publish loans to Kafka and count them (§5.10). The broker is the kafka service of compose.yaml.
  kafka:
    enabled: true

spring:
  # db/demo holds a repeatable migration with sample data. It is on the Flyway path only here, so
  # tests and other profiles never get it. Guide: §5.4.
  flyway:
    locations: classpath:db/migration,classpath:db/demo
  jpa:
    properties:
      hibernate:
        format_sql: true
  # Boot's Docker Compose support has no Kafka connection details (it has them for Testcontainers),
  # so the address is written here: the port compose.yaml publishes. (It is also the default.)
  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    dev.playground: DEBUG
    # Every SQL statement Hibernate sends, and (TRACE) the values bound to its ? parameters.
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Signs and checks the JWTs (§5.7). A dev-only value, committed so the dev profile runs as is. Any
# other environment sets its own secret (LIBRARY_SECURITY_JWT_SECRET) and never commits it.
library.security.jwt.secret: dev-only-secret-change-me-0123456789abcdef
